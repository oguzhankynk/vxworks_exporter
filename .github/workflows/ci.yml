name: CI

# The host jobs run on GitHub's runners. The VxWorks job needs the VxWorks
# SDK, which may not be redistributed, so it runs only on a self-hosted runner
# that has the SDK installed: label the runner "vxworks", set the repository
# variable VXWORKS_RUNNER to "true", and set VXWORKS_WIND_HOME to the SDK
# directory on that machine.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.preset }} (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            compiler: gcc
          - preset: debug
            compiler: clang
          - preset: asan
            compiler: gcc
          - preset: tsan
            compiler: gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-14 clang-tidy-14 clang-format-14 \
            cppcheck gcovr doxygen graphviz

      - name: Select compiler
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang-14" >> "$GITHUB_ENV"
          echo "CXX=clang++-14" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  tidy:
    name: clang-tidy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-14 clang-tidy-14
      - name: Configure and build
        run: |
          cmake --preset tidy
          cmake --build --preset tidy

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cppcheck
      - name: Configure and build
        run: |
          cmake --preset cppcheck
          cmake --build --preset cppcheck

  format:
    name: clang-format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
      - name: Check formatting
        run: |
          git ls-files '*.hpp' '*.cpp' '*.h' \
            | xargs clang-format-14 --dry-run --Werror

  docs:
    name: Doxygen
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build doxygen graphviz
      - name: Check documentation coverage
        run: |
          cmake --preset debug
          cmake --build --preset debug --target docs-check
      - name: Build HTML site
        run: cmake --build --preset debug --target docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/debug/docs/html


  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          # Ubuntu 22.04's apt gcovr is 5.0, which rejects the bare
          # --gcov-ignore-parse-errors value used by cmake/Coverage.cmake.
          python3 -m pip install --user "gcovr==8.6"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure and build
        run: |
          cmake --preset coverage
          cmake --build --preset coverage --target coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/coverage

  vxworks:
    name: VxWorks ${{ matrix.preset }} (QEMU)
    if: vars.VXWORKS_RUNNER == 'true'
    runs-on: [self-hosted, vxworks]
    strategy:
      fail-fast: false
      matrix:
        preset: [vx-rtp-debug, vx-rtp-ubsan, vx-dkm]
    env:
      WIND_HOME: ${{ vars.VXWORKS_WIND_HOME }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test in QEMU
        run: ctest --preset ${{ matrix.preset }} --output-junit junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/junit.xml
